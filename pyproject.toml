[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "website-analyzer"
version = "0.1.0"
description = "An authorized-access website analysis framework"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Website Analyzer contributors" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.28.1",
  "lxml>=5.3.0",
  "networkx>=3.4.2",
  "orjson>=3.10.15",
  "pillow>=11.1.0",
  "playwright>=1.50.0",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "rich>=13.9.4",
  "sqlalchemy>=2.0.37",
  "typer>=0.15.1",
]

[project.scripts]
website-analyzer = "website_analyzer.cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.2", "ruff>=0.9.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/website_analyzer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.ignore = ["B008"]
